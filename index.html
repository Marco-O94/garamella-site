<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garamella PT</title>
<meta name="description" content="Garamella PT: l'app del personal trainer Danilo Garamella per schede, allenamenti, alimentazione e prenotazioni.">
<style>
  :root { --bg: #0e0e10; --fg: #f2f2f2; --muted: #a8a8ad; --line: #2a2a2f; --accent: #c8102e; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 "Saira", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; }
  h1, h2, h3 { line-height: 1.2; margin: 1.6em 0 .5em; }
  h1 { font-size: 2rem; margin-top: 0; letter-spacing: .02em; }
  h2 { font-size: 1.3rem; padding-top: .4em; border-top: 1px solid var(--line); }
  h3 { font-size: 1.05rem; }
  p, ul, ol { margin: 0 0 1em; }
  ul, ol { padding-left: 1.3em; }
  li { margin: .3em 0; }
  a { color: var(--fg); text-decoration-color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 2px; }
  a:hover, a:focus-visible { color: var(--accent); }
  .overline { color: var(--accent); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: .8rem; margin: 0 0 .4em; }
  .muted { color: var(--muted); font-size: .9rem; }
  .links { list-style: none; padding: 0; margin: 2em 0; }
  .links li { margin: 0 0 12px; }
  .links a { display: block; padding: 16px 18px; border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 6px; text-decoration: none; font-weight: 600; }
  footer { margin-top: 3em; padding-top: 1em; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<main>
  <p class="overline">Personal training</p>
  <h1>Garamella PT</h1>
  <p>L'app di Danilo Garamella, personal trainer: la tua scheda, i tuoi allenamenti, l'alimentazione e le prenotazioni delle sessioni, in un unico posto.</p>
  <ul class="links">
    <li><a href="privacy.html">Informativa sulla privacy</a></li>
    <li><a href="support.html">Supporto</a></li>
    <li><a href="support.html#elimina-account">Eliminare l'account</a></li>
  </ul>
  <footer>
    <p class="muted">Danilo Garamella · danilo.garamella@icloud.com</p>
  </footer>
</main>
</body>
</html>
